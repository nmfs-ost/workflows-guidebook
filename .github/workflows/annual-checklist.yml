# create a new issue annually on September 1 with
# reminders for both the Workflows team and steering committee
# to review the guidebook and update it where necessary
name: annual-checklist
on:
  schedule:
    - cron: '0 0 1 9 *'
  workflow_dispatch:

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create Annual Review Checklist Issue
        uses: imjohnbo/issue-bot@v3
        with:
          assignees: "${{ github.actor }}"
          title: "Review Checklist - Annual Update"
          body: |
            # Annual review checklist

            - [ ] Workflows team has reviewed guidebook and updated it as necessary
            - [ ] Steering committee has reviewed guidebook and updated it as necessary
          token: ${{ secrets.GITHUB_TOKEN }}